<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar cliente')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-4" style="max-width: 860px">
        <h1 class="h2 mb-4">Editar cliente</h1>

        <!-- Formulario existente de Cliente -->
        <form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post" class="card card-body shadow-sm mb-5">
            <h5 class="card-title text-secondary mb-3">Datos del cliente</h5>
            <div class="mb-3"><label class="form-label" for="id">ID</label><input class="form-control" id="id" th:field="*{id}" readonly></div>
            <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" th:field="*{nombre}" required></div>
            <div class="mb-3"><label class="form-label" for="apellido1">Apellido 1</label><input class="form-control" id="apellido1" th:field="*{apellido1}" required></div>
            <div class="mb-3"><label class="form-label" for="apellido2">Apellido 2</label><input class="form-control" id="apellido2" th:field="*{apellido2}"></div>
            <div class="mb-3"><label class="form-label" for="ciudad">Ciudad</label><input class="form-control" id="ciudad" th:field="*{ciudad}"></div>
            <div class="mb-4"><label class="form-label" for="categoría">Categoría</label><input class="form-control" id="categoría" type="number" th:field="*{categoría}"></div>
            <div>
                <button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary ms-2" th:href="@{/clientes}">Cancelar</a>
            </div>
        </form>

        <!-- Formulario aparte para añadir comercial con fecha y prioridad -->
        <div class="card shadow-sm mb-5 border-success">
            <div class="card-header bg-success text-white">
                <h5 class="card-title mb-0">Añadir Comercial al Cliente</h5>
            </div>
            <div class="card-body bg-light">
                <form th:action="@{/clientes/editar/{id}/comercial(id=${cliente.id})}" method="post">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label fw-semibold" for="comercialId">Comercial</label>
                            <select class="form-select" id="comercialId" name="comercialId" required>
                                <option value="" disabled selected>-- Seleccionar Comercial --</option>
                                <option th:each="com : ${comercialesDisponibles ?: comerciales}"
                                        th:value="${com.id}"
                                        th:text="${com.nombreCompleto} + ' (Comisión: ' + ${com.comisión} + ')'"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="fecha">Fecha</label>
                            <input class="form-control" id="fecha" type="date" name="fecha">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="prioridad">Prioridad</label>
                            <input class="form-control" id="prioridad" type="number" name="prioridad" min="1" placeholder="Ej: 1, 2...">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-success" type="submit">Añadir Comercial</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Listado de Comerciales vinculados para el cliente debajo del form de añadir comercial -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="card-title mb-0">Comerciales vinculados</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Comercial</th>
                                <th>Comisión</th>
                                <th>Fecha</th>
                                <th>Prioridad</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(comercialesVinculados)}">
                                <td colspan="6" class="text-center text-muted py-3">No hay comerciales vinculados a este cliente.</td>
                            </tr>
                            <tr th:each="cv : ${comercialesVinculados}">
                                <td class="fw-semibold" th:text="${cv.comercialId}">0</td>
                                <td th:text="${cv.comercialNombreCompleto}">Nombre Completo</td>
                                <td th:text="${cv.comercialComision ?: '-'}">0.0</td>
                                <td th:text="${cv.fecha ?: '-'}">-</td>
                                <td th:text="${cv.prioridad ?: '-'}">-</td>
                                <td>
                                    <form th:action="@{/clientes/editar/{clienteId}/comercial/{comercialId}/borrar(clienteId=${cliente.id}, comercialId=${cv.comercialId})}" method="post" class="d-inline">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver al listado</a>
        </div>
    </main>
</body>
</html>
